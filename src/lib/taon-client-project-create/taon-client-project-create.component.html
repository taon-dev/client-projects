<mat-card>
  <mat-card-title class="p-4"> Add project request</mat-card-title>
  <mat-card-content>
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="grid gap-3">
      <mat-form-field
        ><mat-label>Project name</mat-label
        ><input
          matInput
          formControlName="name"
      /></mat-form-field>
      <mat-form-field
        ><mat-label>Full name</mat-label
        ><input
          matInput
          formControlName="contactName"
      /></mat-form-field>
      <mat-form-field
        ><mat-label>Budget</mat-label
        ><input
          matInput
          type="number"
          formControlName="budgetAmount"
      /></mat-form-field>
      <mat-form-field
        ><mat-label>Currency</mat-label
        ><mat-select formControlName="budgetCurrency"
          ><mat-option value="PLN">PLN</mat-option
          ><mat-option value="EUR">EUR</mat-option
          ><mat-option value="USD">USD</mat-option></mat-select
        ></mat-form-field
      >
      <mat-form-field
        ><mat-label>Project description</mat-label
        ><textarea
          matInput
          rows="7"
          formControlName="description"></textarea>
      </mat-form-field>
      <input type="file" multiple (change)="selectAttachments($event)" />
      @for (file of pendingFiles(); track file.name) { <div>{{ file.name }}</div> }
      <button
        mat-flat-button
        [disabled]="form.invalid || sending">
        Add project
      </button>
    </form>
  </mat-card-content>
</mat-card>
