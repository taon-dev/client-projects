<mat-card>
  <mat-card-title class="p-4 !flex flex-row items-center gap-3">
    <span>Projekty</span>

    @if (loading()) {
      <mat-progress-spinner
        diameter="20"
        mode="indeterminate">
      </mat-progress-spinner>
    }
  </mat-card-title>
  <mat-card-content>
    <button
      mat-flat-button
      class="add-inquiry-button mt-2 mb-4"
      routerLink="/projects/new">
      Dodaj zapytanie o projekt
    </button>

    @for (project of projects(); track project.id) {
      <a
        [routerLink]="['/projects', project.id]"
        class="block py-3 taon-client-project">
        <strong>{{ project.name }}</strong>
        <span>{{ project.status }}</span>
      </a>
    } @empty {
      <p>Brak projektów.</p>
    }
  </mat-card-content>
</mat-card>
