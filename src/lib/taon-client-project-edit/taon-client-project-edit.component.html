<mat-card>
  <mat-card-title>Edytuj projekt</mat-card-title>
  <mat-card-content>
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="grid gap-3">
      <mat-form-field
        ><mat-label>Nazwa projektu</mat-label
        ><input
          matInput
          formControlName="name"
      /></mat-form-field>
      <mat-form-field
        ><mat-label>Imię i nazwisko</mat-label
        ><input
          matInput
          formControlName="contactName"
      /></mat-form-field>
      <mat-form-field
        ><mat-label>Budżet</mat-label
        ><input
          matInput
          type="number"
          formControlName="budgetAmount"
      /></mat-form-field>
      <mat-form-field
        ><mat-label>Waluta</mat-label
        ><mat-select formControlName="budgetCurrency"
          ><mat-option value="PLN">PLN</mat-option
          ><mat-option value="EUR">EUR</mat-option
          ><mat-option value="USD">USD</mat-option></mat-select
        ></mat-form-field
      >
      <mat-form-field
        ><mat-label>Opis projektu</mat-label
        ><textarea
          matInput
          rows="7"
          formControlName="description"></textarea>
      </mat-form-field>
      <button
        mat-flat-button
        [disabled]="form.invalid">
        Zapisz
      </button>
    </form>
  </mat-card-content>
</mat-card>
