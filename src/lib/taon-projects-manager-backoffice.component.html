<mat-card>
  <mat-card-title>List of Projects</mat-card-title>
  <mat-card-content>
    <mat-form-field
      ><mat-label>Search</mat-label
      ><input
        matInput
        [(ngModel)]="search"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>View</mat-label
      ><mat-select [(ngModel)]="archived"
        ><mat-option [value]="false">Active</mat-option
        ><mat-option [value]="true">Archived</mat-option></mat-select
      ></mat-form-field
    >
    <button
      mat-stroked-button
      (click)="refresh()">
      Refresh
    </button>
    @for (project of filtered(); track project.id) {
      <div class="py-2">
        @if (project.restricted) {
          <strong>🔒 {{ project.name }}</strong>
        } @else {
          <strong>{{ project.name }}</strong> · {{ project.status }}
        }
        @if (!project.restricted) {
          <a mat-button [routerLink]="['preview', project.id]">Preview</a>
          <button mat-button (click)="openAssignments(project)">Assign administrators</button>
          @if (project.archivedAt) {
            <button mat-button (click)="restore(project)">Restore</button>
          } @else {
            <button mat-button (click)="archive(project)">Archive</button>
          }
        }
      </div>
    } @empty {
      <p>No projects.</p>
    }
  </mat-card-content>
</mat-card>
